<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>הירו במסגרת — Printing Parts 3D</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&display=swap">
  <style>
    :root{--ink:#ffffff;--orange:#ff7100;--line:#d2d0ca}
    *{box-sizing:border-box}body{margin:0;background:var(--ink);color:#252833;font-family:Rubik,Arial,sans-serif;padding:12px}
    a{color:inherit;text-decoration:none}button{font:inherit}a:focus-visible,button:focus-visible{outline:2px solid white;outline-offset:-6px}
    .frame{border:1px solid var(--line);min-height:calc(100svh - 24px);display:grid;grid-template-rows:74px minmax(300px,1fr) auto auto}
    .media{position:relative;grid-row:2;min-height:0;overflow:hidden;background:#17191f;clip-path:polygon(0 0,100% 0,100% 100%,16% 100%,0 calc(100% - 86px))}
    video{position:absolute;width:100%;height:100%;object-fit:cover;object-position:center 48%}
    .media:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(16,18,24,.32),transparent 55%);pointer-events:none}
    .media-tag{position:absolute;z-index:1;bottom:0;right:0;display:flex;align-items:center;gap:24px;padding:16px 28px;background:var(--ink);border-top:1px solid var(--line);border-left:1px solid var(--line);font-size:11px;letter-spacing:.08em}
    .media-tag span{color:var(--orange)}
    .pause{position:absolute;z-index:2;left:22px;top:18px;border:1px solid var(--line);background:var(--ink);color:white;width:36px;height:36px;cursor:pointer;font-size:17px}
    .brand-row{grid-row:1;display:flex;border-bottom:1px solid var(--line)}
    .logo{display:flex;align-items:center;padding:14px 28px;border-left:1px solid var(--line)}
    .logo img{display:block;width:150px;height:auto;filter:brightness(0) saturate(100%) invert(43%) sepia(98%) saturate(3358%) hue-rotate(353deg) brightness(102%) contrast(105%);zoom:.7}
    nav{display:flex;flex:1}nav a{display:flex;align-items:center;padding:0 26px;border-left:1px solid var(--line);font-size:13px}nav a:hover{color:var(--orange)}
    .edition{margin-right:auto;padding:0 28px;display:flex;align-items:center;direction:ltr;font-size:10px;letter-spacing:.14em;color:#252833}
    .headline{position:relative;padding:28px 36px 30px;border-top:0}
    .headline:after{content:"";position:absolute;top:0;left:16%;right:0;height:1px;background:var(--line);pointer-events:none}
    .headline:before{content:"";position:absolute;bottom:100%;left:0;width:16%;height:86px;background:linear-gradient(to top right,transparent calc(50% - .7px),var(--line) 50%,transparent calc(50% + .7px));pointer-events:none}
    h1{margin:0;font-size:clamp(32px,3.8vw,62px);font-weight:300;line-height:1.12;letter-spacing:-.035em}
    h1 span{color:var(--orange)}
    .bottom{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,30%);border-top:1px solid var(--line)}
    .description{padding:22px 36px;display:flex;align-items:center;gap:40px;background:#252833;color:#fff}
    .index{font-size:11px;color:var(--orange);direction:ltr;white-space:nowrap}
    p{max-width:650px;margin:0;font-size:14px;line-height:1.6;color:inherit}
    .cta{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:26px 30px;background:var(--orange);color:#fff;font-size:17px;border-right:1px solid var(--line)}
    .cta b{font-size:30px;font-weight:300}
    .cta span,.cta b{display:inline-block;transition:transform .25s ease}
    .cta:hover span,.cta:focus-visible span{transform:translateX(-4px)}
    .cta:hover b,.cta:focus-visible b{transform:translate(-5px,5px)}
    [dir="ltr"] .cta:hover span,[dir="ltr"] .cta:focus-visible span{transform:translateX(4px)}
    @media(prefers-reduced-motion:reduce){.cta span,.cta b{transition:none;transform:none!important}}
    @media(min-width:1025px){.frame{height:calc(100svh - 24px);min-height:760px}}
    @media(max-width:1024px){.frame{grid-template-rows:68px minmax(350px,48svh) auto auto}nav a{padding:0 16px}.edition{display:none}.headline{padding:26px}h1{font-size:clamp(30px,4.8vw,48px)}.description{padding:24px 26px;gap:24px}.bottom{grid-template-columns:1fr 34%}.logo{padding:14px 20px}.logo img{width:120px}}
    @media(max-width:620px){body{padding:8px}.frame{min-height:calc(100svh - 16px);grid-template-rows:58px minmax(250px,40svh) auto auto}.logo{padding:12px 14px}.logo img{width:90px}nav{align-items:stretch;justify-content:flex-end}nav a{padding:0 12px;font-size:11px}nav a:nth-child(1),nav a:nth-child(3){display:none}.media-tag{font-size:9px;padding:12px 16px;gap:16px}.pause{left:12px;bottom:10px}.headline{padding:23px 20px}h1{font-size:clamp(25px,6.6vw,38px);line-height:1.18}.bottom{grid-template-columns:1fr}.description{padding:19px 20px;gap:18px;align-items:flex-start}p{font-size:12px;line-height:1.55}.index{font-size:9px;padding-top:3px}.cta{min-height:74px;padding:18px 20px;border-right:0;border-top:1px solid var(--line);font-size:15px}}
    @media(prefers-reduced-motion:reduce){video{display:none}.media{background:url('assets/plates/hero-video.jpg') center/cover}.pause{display:none}}
    .header-tools{display:flex;align-items:center;gap:20px;padding:0 24px;direction:ltr}
    .header-tools a,.language-control{position:relative;display:grid;place-items:center;width:32px;height:44px}
    .header-tools svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7}
    .language-control select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
    .language-control:focus-within{outline:2px solid #252833}
    .brand-row{position:relative;z-index:5}
    .language-trigger{display:grid;place-items:center;width:32px;height:44px;padding:0;border:0;background:transparent;color:inherit;cursor:pointer}
    .language-options{position:absolute;top:calc(100% + 10px);left:0;width:176px;padding:8px;border:1px solid #d2d0ca;background:#fff;color:#252833;direction:rtl;box-shadow:0 12px 32px #25283326;display:none}
    [dir="ltr"] .language-options{left:auto;right:0;direction:ltr}
    .language-menu.is-open .language-options{display:block}
    .language-options button{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;padding:0 12px;border:0;background:#fff;color:#252833;text-align:start;cursor:pointer}
    .language-options button+button{border-top:1px solid #d2d0ca}
    .language-options button:hover,.language-options button:focus-visible{background:#f3f3f0}
    .language-options button span{color:#ff7100;visibility:hidden}
    .language-options button.is-active span{visibility:visible}
    @media(max-width:620px){.header-tools{padding:0 8px;gap:4px}nav a{padding:0 8px;font-size:10px}.header-tools a,.language-control{width:28px}}
  </style>
</head>
<body>
  <main class="frame">
    <div class="media">
      <video autoplay muted loop playsinline poster="assets/plates/hero-video.jpg"><source src="assets/video/hero-beni.mp4" type="video/mp4"></video>
    </div>
    <header class="brand-row">
      <a class="logo" href="index.html" aria-label="Printing Parts 3D — דף הבית"><img src="assets/brand-logo.svg" alt="Printing Parts 3D"></a>
      <nav aria-label="ניווט ראשי"><a href="about.html">אודות</a><a href="technologies.html">טכנולוגיות</a><a href="materials.html">יכולות וחומרים</a><a href="contact.html">צור קשר</a></nav>
      <div class="header-tools">
        <label class="language-control"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c5 5 5 13 0 18M12 3c-5 5-5 13 0 18"/></svg><select aria-label="בחירת שפה"><option value="he">עברית</option><option value="en">English</option></select></label>
        <a href="https://www.instagram.com/printing_parts_3d/" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.4" cy="6.7" r=".8"/></svg></a>
      </div>
    </header>
    <div class="headline"><h1>המרכז להדפסה תלת־ממדית<br><span>למהנדסים, מעצבים ויזמים.</span></h1></div>
    <div class="bottom">
      <div class="description"><p>מתכנון הנדסי ועד חלק מוגמר — פתרונות הדפסה תלת־ממדית שנבנים סביב הדרישות האמיתיות של הפרויקט.</p></div>
      <a class="cta" href="contact.html#project-form"><span>שלחו פרויקט לבדיקה</span><b aria-hidden="true">↙</b></a>
    </div>
  </main>
  <script>
    const video=document.querySelector('video');
    if(matchMedia('(prefers-reduced-motion: reduce)').matches)video.pause();
    const language=document.querySelector('.language-control select');
    language.classList.add('language-select');
    language.parentElement.classList.add('language-menu');
    const heading=document.querySelector('h1'),paragraph=document.querySelector('.description p'),cta=document.querySelector('.cta span'),links=[...document.querySelectorAll('nav a')];
    const original={heading:heading.innerHTML,paragraph:paragraph.textContent,cta:cta.textContent,nav:links.map(a=>a.textContent)};
    language.addEventListener('change',()=>{
      const english=language.value==='en';document.documentElement.lang=language.value;document.documentElement.dir=english?'ltr':'rtl';
      heading.innerHTML=english?'THE 3D PRINTING CENTER<br><span>FOR ENGINEERS, DESIGNERS &amp; ENTREPRENEURS.</span>':original.heading;
      paragraph.textContent=english?'From engineering design to a finished part — additive manufacturing solutions built around the real requirements of your project.':original.paragraph;
      cta.textContent=english?'Send a project for review':original.cta;
      links.forEach((a,i)=>a.textContent=english?['About','Technologies','Capabilities & Materials','Contact'][i]:original.nav[i]);
    });
  </script>
  <script src="language-menu.js?v=20261019-wheel-inertia"></script>
</body>
</html>
