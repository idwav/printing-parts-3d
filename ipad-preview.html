<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>תצוגת iPad — Printing Parts 3D</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:24px;background:#e8e7e2;color:#252833;font-family:Arial,sans-serif}
    header{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;margin-bottom:20px}
    button{padding:10px 18px;border:1px solid #252833;background:white;color:#252833;cursor:pointer;font:inherit}a{color:inherit}
    .stage{margin:auto;position:relative}.device{position:absolute;top:0;left:0;padding:18px;background:#252833;border-radius:30px;transform-origin:top left}
    iframe{display:block;border:0;border-radius:14px;background:white}
  </style>
</head>
<body>
  <header><strong>תצוגת iPad</strong><span id="size"></span><button id="rotate" type="button">מעבר לרוחב</button><a href="index.html">פתיחת האתר בדסקטופ</a></header>
  <main class="stage"><div class="device"><iframe src="index.html" title="תצוגת האתר בטאבלט"></iframe></div></main>
  <script>
    let landscape=false;
    const stage=document.querySelector('.stage'),device=document.querySelector('.device'),frame=document.querySelector('iframe'),button=document.querySelector('button');
    function fit(){
      const width=landscape?1180:820,height=landscape?820:1180;
      frame.style.width=width+'px';frame.style.height=height+'px';
      const scale=Math.min(1,(innerWidth-48)/(width+36),Math.max(200,innerHeight-document.querySelector('header').offsetHeight-72)/(height+36));
      device.style.width=(width+36)+'px';device.style.transform='scale('+scale+')';
      stage.style.width=(width+36)*scale+'px';stage.style.height=(height+36)*scale+'px';
      document.querySelector('#size').textContent=width+' × '+height;
      button.textContent=landscape?'מעבר לאורך':'מעבר לרוחב';
    }
    button.addEventListener('click',()=>{landscape=!landscape;fit()});window.addEventListener('resize',fit);fit();
  </script>
</body>
</html>
